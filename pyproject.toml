[project]
name = "joola-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "supabase>=2.7.0",
  "openai>=1.30.0",
  "statsmodels>=0.14.0",
  "ruptures>=1.1.9",
  "scipy>=1.13.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "apscheduler>=3.10.4",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
